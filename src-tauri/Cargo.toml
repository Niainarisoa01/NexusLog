[package]
name = "nexuslog"
version = "0.1.0"
description = "NexusLog — Ultra-fast Windows Event Log Viewer powered by Rust + Tauri"
authors = ["Niainarisoa"]
license = "MIT"
repository = "https://github.com/Niainarisoa01/NexusLog"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "nexuslog_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
# Core Tauri
tauri = { version = "2.10.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# EVTX Parsing
evtx = "0.11.2"
rayon = "1.10.0"

# Async Runtime
tokio = { version = "1.50.0", features = ["full"] }
flume = "0.12.0"

# Data & Time
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }

# Error Handling & Logging
thiserror = "2.0.18"
log = "0.4"
tracing = "0.1"
tracing-subscriber = "0.3"
clap = { version = "4.5", features = ["derive"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_System_EventLog", "Win32_Foundation", "Win32_System_Console"] }
clap = { version = "4.5", features = ["derive"] }
